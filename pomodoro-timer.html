<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 番茄钟 - Pomodoro Timer</title>
<style>
  /* ========== Google Fonts ========== */
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  /* ========== CSS 变量 ========== */
  :root {
    --bg-deep: #06060e;
    --bg-card: rgba(10, 10, 30, 0.75);
    --text: #e8e8f0;
    --text-secondary: #8888a8;
    --text-muted: #5a5a78;
    --accent: #00e5ff;
    --accent-glow: rgba(0, 229, 255, 0.5);
    --accent-2: #b44dff;
    --accent-2-glow: rgba(180, 77, 255, 0.5);
    --break-color: #69f0ae;
    --break-glow: rgba(105, 240, 174, 0.45);
    --ring-track: rgba(255, 255, 255, 0.06);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-glow: rgba(0, 229, 255, 0.25);
    --shadow-card: 0 8px 48px rgba(0, 0, 0, 0.5);
    --font-mono: 'Share Tech Mono', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    --font-sans: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-sans);
    background: var(--bg-deep);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  /* ========== 网格背景 ========== */
  .bg-grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 60% 50% at 50% 40%, black 30%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 40%, black 30%, transparent 70%);
  }

  /* ========== 噪点纹理 ========== */
  .bg-noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  /* ========== 霓虹光晕 ========== */
  .bg-glow {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.12;
  }
  .bg-glow.g1 {
    width: 500px; height: 500px;
    background: var(--accent);
    top: -15%; left: -10%;
    animation: glowDrift1 12s ease-in-out infinite;
  }
  .bg-glow.g2 {
    width: 400px; height: 400px;
    background: var(--accent-2);
    bottom: -20%; right: -8%;
    animation: glowDrift2 14s ease-in-out infinite;
  }
  @keyframes glowDrift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(40px, -20px) scale(1.15); }
    66% { transform: translate(-20px, 30px) scale(0.9); }
  }
  @keyframes glowDrift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-30px, -25px) scale(1.2); }
  }

  /* ========== 主容器 — 玻璃拟态 ========== */
  .container {
    position: relative; z-index: 1;
    background: var(--bg-card);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 1px solid var(--border-subtle);
    border-radius: 40px;
    padding: 44px 36px 32px;
    box-shadow:
      var(--shadow-card),
      inset 0 1px 0 rgba(255,255,255,0.04);
    text-align: center;
    width: 440px;
    transition: border-color 0.6s, box-shadow 0.6s;
    animation: cardIn 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .container.break-mode {
    border-color: rgba(105, 240, 174, 0.2);
    box-shadow: var(--shadow-card), 0 0 80px rgba(105, 240, 174, 0.08), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  /* ========== 装饰斜线 ========== */
  .deco-line {
    position: absolute;
    pointer-events: none;
    z-index: 0;
  }
  .deco-line.d1 {
    top: -1px; right: 60px;
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
    animation: decoShimmer 3s ease-in-out infinite;
  }
  .deco-line.d2 {
    bottom: 60px; left: 40px;
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-2), transparent);
    opacity: 0.4;
    animation: decoShimmer 3s ease-in-out 1.5s infinite;
  }
  @keyframes decoShimmer {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  /* ========== 模式标签 ========== */
  .mode-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 22px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 28px;
    background: rgba(0, 229, 255, 0.08);
    border: 1px solid rgba(0, 229, 255, 0.18);
    color: var(--accent);
    transition: all 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
    position: relative;
    z-index: 1;
  }
  .mode-tag .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
    animation: dotPulse 2s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 6px var(--accent-glow); }
    50% { box-shadow: 0 0 16px var(--accent-glow), 0 0 24px var(--accent-glow); }
  }
  .break-mode .mode-tag {
    background: rgba(105, 240, 174, 0.08);
    border-color: rgba(105, 240, 174, 0.18);
    color: var(--break-color);
  }
  .break-mode .mode-tag .dot {
    background: var(--break-color);
    animation-name: dotPulseGreen;
  }
  @keyframes dotPulseGreen {
    0%, 100% { box-shadow: 0 0 6px var(--break-glow); }
    50% { box-shadow: 0 0 16px var(--break-glow), 0 0 24px var(--break-glow); }
  }

  /* ========== 环形进度 ========== */
  .ring-container {
    position: relative;
    width: 270px; height: 270px;
    margin: 0 auto 32px;
    z-index: 1;
  }
  .ring-container svg {
    transform: rotate(-90deg);
    width: 270px; height: 270px;
    filter: drop-shadow(0 0 18px var(--accent-glow));
    transition: filter 0.5s;
  }
  .break-mode .ring-container svg {
    filter: drop-shadow(0 0 18px var(--break-glow));
  }
  .ring-track {
    fill: none;
    stroke: var(--ring-track);
    stroke-width: 8;
  }
  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.35s cubic-bezier(0.22, 0.61, 0.36, 1), stroke 0.5s;
  }
  .break-mode .ring-progress {
    stroke: var(--break-color);
  }

  /* 环形上的刻度标记 */
  .tick-mark {
    position: absolute;
    width: 2px; height: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 1px;
    top: 0; left: 50%;
    transform-origin: center 135px;
  }

  /* 时间显示 */
  .time-display {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 1;
  }
  .time {
    font-family: var(--font-mono);
    font-size: 64px;
    font-weight: 400;
    letter-spacing: 4px;
    font-variant-numeric: tabular-nums;
    color: #fff;
    text-shadow: 0 0 40px var(--accent-glow);
    transition: color 0.5s, text-shadow 0.5s;
    line-height: 1;
  }
  .break-mode .time {
    text-shadow: 0 0 40px var(--break-glow);
  }
  .time-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 2px;
    transition: color 0.5s;
  }
  .break-mode .time-label {
    color: rgba(105, 240, 174, 0.7);
  }

  /* 完成脉冲动画 */
  @keyframes ringPulse {
    0%, 100% { filter: drop-shadow(0 0 18px var(--accent-glow)); }
    50% { filter: drop-shadow(0 0 40px var(--accent-glow)) drop-shadow(0 0 60px var(--accent-glow)); }
  }
  .ring-container.flash svg {
    animation: ringPulse 0.5s ease-in-out 4;
  }

  /* ========== 控制按钮 ========== */
  .controls {
    display: flex;
    gap: 18px;
    justify-content: center;
    align-items: center;
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }
  .btn {
    border: 1px solid var(--border-subtle);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: var(--font-sans);
  }
  .btn::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .btn-primary {
    background: rgba(0, 229, 255, 0.1);
    color: var(--accent);
    width: 72px; height: 72px;
    font-size: 28px;
    border-color: rgba(0, 229, 255, 0.3);
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.12);
  }
  .btn-primary::after {
    box-shadow: 0 0 0 4px rgba(0, 229, 255, 0.2);
  }
  .btn-primary:hover {
    transform: scale(1.08);
    box-shadow: 0 0 45px rgba(0, 229, 255, 0.22);
    border-color: rgba(0, 229, 255, 0.5);
  }
  .btn-primary:hover::after { opacity: 1; }
  .btn-primary:active { transform: scale(0.94); }
  .break-mode .btn-primary {
    background: rgba(105, 240, 174, 0.1);
    color: var(--break-color);
    border-color: rgba(105, 240, 174, 0.3);
    box-shadow: 0 0 30px rgba(105, 240, 174, 0.12);
  }
  .break-mode .btn-primary::after {
    box-shadow: 0 0 0 4px rgba(105, 240, 174, 0.2);
  }
  .break-mode .btn-primary:hover {
    box-shadow: 0 0 45px rgba(105, 240, 174, 0.22);
    border-color: rgba(105, 240, 174, 0.5);
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-secondary);
    width: 48px; height: 48px;
    font-size: 18px;
    border-color: rgba(255, 255, 255, 0.06);
  }
  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    border-color: rgba(255, 255, 255, 0.15);
    transform: translateY(-2px);
  }
  .btn-secondary:active { transform: scale(0.93); }

  /* ========== 统计区域 ========== */
  .stats {
    display: flex;
    justify-content: center;
    gap: 0;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
  }
  .stat {
    flex: 1;
    text-align: center;
    padding: 12px 8px;
    position: relative;
  }
  .stat + .stat {
    border-left: 1px solid rgba(255, 255, 255, 0.06);
  }
  .stat-value {
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 400;
    color: #fff;
    letter-spacing: 1px;
    transition: color 0.5s;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
    font-weight: 500;
  }

  /* ========== 时长选择 ========== */
  .duration-pills {
    display: flex;
    justify-content: center;
    gap: 8px;
    position: relative;
    z-index: 1;
  }
  .pill {
    padding: 9px 18px;
    border-radius: 22px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.02);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
    font-family: var(--font-sans);
    letter-spacing: 0.5px;
  }
  .pill:hover {
    border-color: rgba(255, 255, 255, 0.2);
    color: var(--text);
    background: rgba(255, 255, 255, 0.04);
  }
  .pill.active {
    background: rgba(0, 229, 255, 0.1);
    border-color: rgba(0, 229, 255, 0.35);
    color: var(--accent);
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
  }
  .break-mode .pill.active {
    background: rgba(105, 240, 174, 0.1);
    border-color: rgba(105, 240, 174, 0.35);
    color: var(--break-color);
    box-shadow: 0 0 20px rgba(105, 240, 174, 0.1);
  }

  /* ========== 通知提示 ========== */
  .notify-hint {
    margin-top: 18px;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    opacity: 0.5;
    transition: all 0.3s;
    position: relative;
    z-index: 1;
    letter-spacing: 1px;
  }
  .notify-hint:hover {
    opacity: 1;
    color: var(--text-secondary);
  }

  /* ========== 完成动画序列 ========== */
  @keyframes timeFlash {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    30% { transform: translate(-50%, -50%) scale(1.06); }
    60% { transform: translate(-50%, -50%) scale(0.97); }
  }
  .time-display.flash {
    animation: timeFlash 0.5s ease-in-out 4;
  }

  /* ========== 响应式 ========== */
  @media (max-width: 480px) {
    .container {
      width: 92vw;
      padding: 32px 20px 24px;
      border-radius: 28px;
    }
    .ring-container {
      width: 220px; height: 220px;
    }
    .ring-container svg {
      width: 220px; height: 220px;
    }
    .time { font-size: 48px; }
    .controls { gap: 12px; }
    .btn-primary { width: 60px; height: 60px; font-size: 24px; }
    .btn-secondary { width: 42px; height: 42px; font-size: 16px; }
    .stats { gap: 0; }
    .stat-value { font-size: 20px; }
    .duration-pills { gap: 5px; }
    .pill { padding: 7px 12px; font-size: 12px; }
  }
</style>
</head>
<body>

<!-- 背景层 -->
<div class="bg-grid"></div>
<div class="bg-noise"></div>
<div class="bg-glow g1"></div>
<div class="bg-glow g2"></div>

<!-- 主容器 -->
<div class="container" id="container">
  <!-- 装饰线 -->
  <div class="deco-line d1"></div>
  <div class="deco-line d2"></div>

  <!-- 模式标签 -->
  <div class="mode-tag" id="modeTag">
    <span class="dot"></span>
    <span>专注工作</span>
  </div>

  <!-- 环形进度条 -->
  <div class="ring-container" id="ringContainer">
    <svg viewBox="0 0 270 270">
      <circle class="ring-track" cx="135" cy="135" r="126"/>
      <circle class="ring-progress" id="ringProgress" cx="135" cy="135" r="126"
              stroke-dasharray="791.68" stroke-dashoffset="0"/>
    </svg>
    <div class="time-display" id="timeDisplay">
      <div class="time" id="timeText">25:00</div>
      <div class="time-label" id="timeLabel">分钟</div>
    </div>
  </div>

  <!-- 控制按钮 -->
  <div class="controls">
    <button class="btn btn-secondary" id="btnReset" title="重置 (R)">↺</button>
    <button class="btn btn-primary" id="btnStart" title="开始 (空格)">▶</button>
    <button class="btn btn-secondary" id="btnSkip" title="跳过 (S)">⏭</button>
  </div>

  <!-- 统计 -->
  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="sessionCount">0</div>
      <div class="stat-label">完成番茄</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="totalFocus">0min</div>
      <div class="stat-label">总专注</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="todayCount">0</div>
      <div class="stat-label">今日完成</div>
    </div>
  </div>

  <!-- 时长选择 -->
  <div class="duration-pills" id="durationPills">
    <button class="pill" data-work="15" data-break="5">15 / 5</button>
    <button class="pill active" data-work="25" data-break="5">25 / 5</button>
    <button class="pill" data-work="45" data-break="10">45 / 10</button>
    <button class="pill" data-work="50" data-break="10">50 / 10</button>
  </div>

  <div class="notify-hint" id="notifyHint" title="点击开启桌面通知">🔔 开启桌面通知提醒</div>
</div>

<script>
  // ==================== 状态管理 ====================
  const CIRCUMFERENCE = 2 * Math.PI * 126; // ≈ 791.68

  const state = {
    isRunning: false,
    isBreak: false,
    isPaused: false,
    workDuration: 25 * 60,
    breakDuration: 5 * 60,
    timeLeft: 25 * 60,
    totalSeconds: 25 * 60,
    sessionCount: parseInt(localStorage.getItem('pomo_sessions') || '0'),
    totalFocusMin: parseInt(localStorage.getItem('pomo_total_min') || '0'),
    todayCount: 0,
    todayDate: new Date().toDateString(),
    intervalId: null,
    notificationEnabled: false,
  };

  // 从 localStorage 恢复今日统计
  const savedToday = localStorage.getItem('pomo_today');
  if (savedToday) {
    try {
      const t = JSON.parse(savedToday);
      if (t.date === state.todayDate) {
        state.todayCount = t.count;
      }
    } catch(e) {}
  }
  function saveToday() {
    localStorage.setItem('pomo_today', JSON.stringify({
      date: state.todayDate,
      count: state.todayCount,
    }));
  }

  // ==================== DOM 元素 ====================
  const container = document.getElementById('container');
  const modeTag = document.getElementById('modeTag');
  const ringProgress = document.getElementById('ringProgress');
  const ringContainer = document.getElementById('ringContainer');
  const timeText = document.getElementById('timeText');
  const timeLabel = document.getElementById('timeLabel');
  const timeDisplay = document.getElementById('timeDisplay');
  const btnStart = document.getElementById('btnStart');
  const btnReset = document.getElementById('btnReset');
  const btnSkip = document.getElementById('btnSkip');
  const sessionCountEl = document.getElementById('sessionCount');
  const totalFocusEl = document.getElementById('totalFocus');
  const todayCountEl = document.getElementById('todayCount');
  const notifyHint = document.getElementById('notifyHint');
  const durationPills = document.getElementById('durationPills');

  // ==================== 音频 (Web Audio API) ====================
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playBeep(freq, duration, type = 'sine', vol = 0.3) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    } catch(e) { /* 静默处理 */ }
  }

  function playFinishSound() {
    playBeep(523, 0.15, 'sine', 0.25);
    setTimeout(() => playBeep(659, 0.15, 'sine', 0.25), 150);
    setTimeout(() => playBeep(784, 0.15, 'sine', 0.25), 300);
    setTimeout(() => playBeep(1047, 0.4, 'sine', 0.3), 450);
  }

  function playClickSound() {
    playBeep(880, 0.05, 'sine', 0.1);
  }

  function playTickSound() {
    playBeep(1000, 0.03, 'sine', 0.05);
  }

  // ==================== 通知 ====================
  function checkNotificationPermission() {
    if ('Notification' in window) {
      if (Notification.permission === 'granted') {
        state.notificationEnabled = true;
        notifyHint.textContent = '✅ 桌面通知已开启';
        notifyHint.style.cursor = 'default';
      } else if (Notification.permission === 'denied') {
        notifyHint.textContent = '🚫 通知已禁用';
        notifyHint.style.cursor = 'default';
      } else {
        notifyHint.textContent = '🔔 点击开启桌面通知提醒';
      }
    } else {
      notifyHint.style.display = 'none';
    }
  }

  async function requestNotification() {
    if ('Notification' in window && Notification.permission === 'default') {
      const perm = await Notification.requestPermission();
      if (perm === 'granted') state.notificationEnabled = true;
      checkNotificationPermission();
    }
  }

  function sendNotification(title, body) {
    if (state.notificationEnabled && 'Notification' in window) {
      new Notification(title, {
        body,
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">🍅</text></svg>',
        silent: false,
      });
    }
  }

  // ==================== 渲染 ====================
  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function updateDisplay() {
    timeText.textContent = formatTime(state.timeLeft);

    // 更新环形进度
    const progress = state.timeLeft / state.totalSeconds;
    ringProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);

    // 更新统计
    sessionCountEl.textContent = state.sessionCount;
    totalFocusEl.textContent = state.totalFocusMin + 'min';
    todayCountEl.textContent = state.todayCount;

    // 更新模式
    const dotSpan = modeTag.querySelector('.dot');
    const labelSpan = modeTag.querySelector('span:last-child');
    if (state.isBreak) {
      container.classList.add('break-mode');
      if (labelSpan) labelSpan.textContent = '休息时间';
      timeLabel.textContent = '休息';
    } else {
      container.classList.remove('break-mode');
      if (labelSpan) labelSpan.textContent = '专注工作';
      timeLabel.textContent = '分钟';
    }

    // 更新按钮图标
    if (state.isRunning && !state.isPaused) {
      btnStart.textContent = '⏸';
      btnStart.title = '暂停 (空格)';
    } else {
      btnStart.textContent = '▶';
      btnStart.title = '开始 (空格)';
    }
  }

  // ==================== 计时器 ====================
  function tick() {
    if (state.isPaused) return;

    if (state.timeLeft > 0) {
      state.timeLeft--;
      updateDisplay();

      if (state.timeLeft <= 5 && state.timeLeft > 0) {
        playTickSound();
      }
    }

    if (state.timeLeft <= 0) {
      finishSession();
    }
  }

  function startTimer() {
    if (state.isRunning && !state.isPaused) {
      state.isPaused = true;
      clearInterval(state.intervalId);
      state.intervalId = null;
      updateDisplay();
      return;
    }

    if (state.isPaused) {
      state.isPaused = false;
      state.intervalId = setInterval(tick, 1000);
      updateDisplay();
      return;
    }

    state.isRunning = true;
    state.isPaused = false;
    state.timeLeft = state.isBreak ? state.breakDuration : state.workDuration;
    state.totalSeconds = state.timeLeft;
    state.intervalId = setInterval(tick, 1000);
    playClickSound();
    updateDisplay();
  }

  function finishSession() {
    clearInterval(state.intervalId);
    state.intervalId = null;
    state.isRunning = false;
    state.isPaused = false;

    playFinishSound();

    if (!state.isBreak) {
      state.sessionCount++;
      state.totalFocusMin += Math.floor(state.workDuration / 60);
      state.todayCount++;
      localStorage.setItem('pomo_sessions', state.sessionCount);
      localStorage.setItem('pomo_total_min', state.totalFocusMin);
      saveToday();
      sendNotification('🍅 番茄完成!', `专注了 ${Math.floor(state.workDuration / 60)} 分钟，真棒！`);
    } else {
      sendNotification('☕ 休息结束', '准备开始下一个番茄吧！');
    }

    state.isBreak = !state.isBreak;
    state.timeLeft = state.isBreak ? state.breakDuration : state.workDuration;
    state.totalSeconds = state.timeLeft;

    // 视觉反馈 — 环形脉冲 + 时间闪烁
    ringContainer.classList.add('flash');
    timeDisplay.classList.add('flash');
    setTimeout(() => {
      ringContainer.classList.remove('flash');
      timeDisplay.classList.remove('flash');
    }, 2000);

    updateDisplay();

    state.isRunning = true;
    state.intervalId = setInterval(tick, 1000);
  }

  function resetTimer() {
    clearInterval(state.intervalId);
    state.intervalId = null;
    state.isRunning = false;
    state.isPaused = false;
    state.isBreak = false;
    state.timeLeft = state.workDuration;
    state.totalSeconds = state.workDuration;
    playClickSound();
    updateDisplay();
  }

  function skipSession() {
    clearInterval(state.intervalId);
    state.intervalId = null;
    state.isRunning = false;
    state.isPaused = false;
    playClickSound();

    state.isBreak = !state.isBreak;
    state.timeLeft = state.isBreak ? state.breakDuration : state.workDuration;
    state.totalSeconds = state.timeLeft;

    updateDisplay();
  }

  // ==================== 时长切换 ====================
  function setDurations(workMin, breakMin) {
    state.workDuration = workMin * 60;
    state.breakDuration = breakMin * 60;
    state.isBreak = false;
    state.isRunning = false;
    state.isPaused = false;
    clearInterval(state.intervalId);
    state.intervalId = null;
    state.timeLeft = state.workDuration;
    state.totalSeconds = state.workDuration;

    document.querySelectorAll('.pill').forEach(p => {
      p.classList.toggle('active',
        parseInt(p.dataset.work) === workMin && parseInt(p.dataset.break) === breakMin);
    });

    playClickSound();
    updateDisplay();
  }

  // ==================== 事件绑定 ====================
  btnStart.addEventListener('click', startTimer);
  btnReset.addEventListener('click', resetTimer);
  btnSkip.addEventListener('click', skipSession);
  notifyHint.addEventListener('click', requestNotification);

  durationPills.addEventListener('click', (e) => {
    const pill = e.target.closest('.pill');
    if (!pill) return;
    const workMin = parseInt(pill.dataset.work);
    const breakMin = parseInt(pill.dataset.break);
    setDurations(workMin, breakMin);
  });

  // 键盘快捷键
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      startTimer();
    } else if (e.code === 'KeyR') {
      resetTimer();
    } else if (e.code === 'KeyS') {
      skipSession();
    }
  });

  // ==================== 初始化 ====================
  function init() {
    checkNotificationPermission();
    updateDisplay();
  }

  init();
</script>
</body>
</html>
